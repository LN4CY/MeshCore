[rak_wismesh_tap]
extends = nrf52_base
board = rak4631
board_check = true
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
extra_scripts = ${nrf52_base.extra_scripts}
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/rak_wismesh_tap
  -I src/helpers/ui
  -D RAK_4631
  -D RAK_WISMESH_TAP
  -D RAK_BOARD
  -D ST7789
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D DISPLAY_ROTATION=3
  -D DISPLAY_SCALE_X=1
  -D DISPLAY_SCALE_Y=1
  -D ENV_INCLUDE_AHTX0=0
  -D PIN_USER_BTN=33
  -D PIN_TFT_CS=26
  -D PIN_TFT_DC=4
  -D PIN_TFT_RST=9
  -D PIN_TFT_BL=21
  -D PIN_TFT_LEDA_CTL=21
  -D PIN_BOARD_SCL=14
  -D PIN_BOARD_SDA=13
  -D PIN_GPS_TX=PIN_SERIAL1_RX
  -D PIN_GPS_RX=PIN_SERIAL1_TX
  -D PIN_GPS_EN=-1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak_wismesh_tap>
  +<helpers/sensors>
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/FT6336Touch.cpp>
  +<helpers/InterTaskMailboxInterface.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:RAK_WisMesh_Tap_standalone]
extends = rak_wismesh_tap
build_flags =
  ${rak_wismesh_tap.build_flags}
  -I examples/companion_radio/ui-tap
  -D WISMESH_TAP_STANDALONE=1
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=64
  -D MESH_DEBUG=1
build_src_filter = ${rak_wismesh_tap.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ArduinoSerialInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-tap/*.cpp>
